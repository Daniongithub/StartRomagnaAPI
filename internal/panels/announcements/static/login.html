<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<base href="/panel/announcements/">
	<title>Accedi · Pannello annunci</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
		<section class="card shadow-sm w-100" style="max-width: 28rem">
			<div class="card-body p-4 p-md-5">
				<h1 class="h3 mb-2">Pannello annunci</h1>
				<p class="text-body-secondary mb-4">Accedi con il provider di identità aziendale.</p>
				<div id="login-error" class="alert alert-danger d-none" role="alert"></div>
				<a class="btn btn-primary w-100" href="auth/start">Accedi con OIDC</a>
			</div>
		</section>
	</main>
	<script>
		const error = new URLSearchParams(window.location.search).get("error");
		if (error) {
			const alert = document.getElementById("login-error");
			alert.textContent = error;
			alert.classList.remove("d-none");
		}
	</script>
</body>
</html>
