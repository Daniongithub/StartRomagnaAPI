<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<base href="/panel/announcements/">
	<title>Pannello annunci</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand" href="./">Pannello annunci</a>
			<div class="d-flex align-items-center gap-3">
				<span class="navbar-text text-white" id="user-name">Caricamento...</span>
				<a class="btn btn-outline-light btn-sm" href="logout">Esci</a>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div id="load-error" class="alert alert-danger d-none" role="alert"></div>
		<section class="card shadow-sm">
			<div class="card-body">
				<h1 class="h4 card-title">Annunci</h1>
				<p class="card-text text-body-secondary mb-0">
					La pagina è pronta per essere configurata. Gli asset statici sono nella cartella
					<code>internal/panels/announcements/static</code>.
				</p>
			</div>
		</section>
	</main>

	<script>
		async function loadUser() {
			const response = await fetch("api/me", { headers: { Accept: "application/json" } });
			if (!response.ok) {
				throw new Error(`Caricamento utente non riuscito (HTTP ${response.status})`);
			}
			const user = await response.json();
			document.getElementById("user-name").textContent = user.name || user.email || "Utente";
		}

		loadUser().catch(error => {
			const alert = document.getElementById("load-error");
			alert.textContent = error.message;
			alert.classList.remove("d-none");
		});
	</script>
</body>
</html>
